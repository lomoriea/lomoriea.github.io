<!DOCTYPE html>
<html>
    <head>
        <title>Bank Account Information</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="bank-account">
            <h2>Bank Account</h2>

            <p>Amount: <span id="money-display">$1000</span></p>
            <p id="status-message">Withdrawl or Deposit?</p>

            <button onclick="takeMoney()">Withdrawl $20</button>

            <button onclick="insertMoney()">Deposit $20</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
