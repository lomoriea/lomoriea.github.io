<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Code Clicker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">
            <header>
                <h1>Code Clicker</h1>
                <h2 id="score-display">0 lines of code</h2>
                <button id="main-button" onclick="writeCode()">Write Code</button>
            </header>

            <main id="shop">
                <h3>Hardware Store (Manual Upgrade)</h3>
                <p>Current Click Power: <span id="power-display">1</span></p>
                <button id="upgrade-button" onClick="buyKeyboard()">
                    Buy Mechanical Keyboard (Cost: <span id="cost-display">50</span>)
                </button>

                <h3>Hiring Department (Auto Clicking)</h3>
                <p>Active Interns: <span id="intern-display">0</span></p>
                <button id="intern-button" onClick="buyIntern()">
                    Hire Intern (Cost: <span id="cost-display-intern">100</span>)
                </button>

                <h3>Best Buy (Manual Upgrade)</h3>
                <p>Current Click Power: <span id="mouse-display">1</span></p>
                <button id="mouse-button" onClick="buyMouse()">
                    Buy Mouse (Cost: <span id="cost-display-mouse">100</span>)
                </button>

                <h3>Hire Manager (Efficient Auto Clicking)</h3>
                <p>Active Managers: <span id="manager-display">0</span></p>
                <button id="manager-button" onClick="buyManager()">
                    Hire Manager (Must have Intern First) (Cost: <span id="cost-display-manager">200</span>)
                </button>
            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
